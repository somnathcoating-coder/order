    {g:'Item / Stock', k:'stockval',   t:'Stock summary',        d:'Qty aur value — godown me kitne ka maal'},
    {g:'Item / Stock', k:'itemparty',  t:'Item report by party', d:'Ek product kis kis party ko becha', needsItem:true},
    {g:'Item / Stock', k:'itemdetail', t:'Item detail report',   d:'Ek item ka poora andar-bahar record', needsItem:true},
    {g:'Item / Stock', k:'profit',     t:'Item-wise profit',     d:'Kis item me kitna margin'},
    {g:'Item / Stock', k:'itemsale',   t:'Item-wise sale',       d:'Kaun sa item kitna bika'},
    {g:'Item / Stock', k:'itembuy',    t:'Item-wise purchase',   d:'Kaun sa item kitna aaya'},
    {g:'Item / Stock', k:'movement',   t:'Stock detail',         d:'Item ka andar, bahar aur closing'},
    {g:'Item / Stock', k:'low',        t:'Low stock summary',    d:'Jo khatam hone wala hai'},
    {g:'Item / Stock', k:'stockcat',   t:'Stock by category',    d:'Category ke hisaab se stock value'},
  ];
  let selParty=null, selItem=null;

  const hub=()=>{
    const groups=[...new Set(REPS.map(r=>r.g))];
    $('#view').innerHTML=`<div class="wrap">
      ${groups.map(g=>`<div class="card mb"><div class="card-h"><h3>${g}</h3></div>
        <div class="card-b"><div class="rgrid">
          ${REPS.filter(r=>r.g===g).map(r=>`<button class="rcard" data-r="${r.k}">
            <b>${r.t}</b><span>${r.d}</span></button>`).join('')}
        </div></div></div>`).join('')}
    </div>`;
    $$('#view .rcard').forEach(b=>b.onclick=()=>{ tab=b.dataset.r; draw() });
  };

  const draw=async()=>{
    if(!tab){ hub(); return }
    const rep=REPS.find(r=>r.k===tab)||{t:'Report'};
    const dated = !['party','stockval','low','outstand','payable','stockcat','partystmt'].includes(tab);
    $('#view').innerHTML=`<div class="wrap">
      <div class="card mb"><div class="card-b">
        <div class="row wrap">
          <button class="btn btn-o btn-sm" id="rBack">← Sab reports</button>
          <div><b style="font-size:15px">${rep.t}</b></div>
          <div class="sp"></div>
          ${rep.needsParty?`<div style="min-width:210px"><label class="f">Party</label>
            <div class="cb"><input class="in" id="rParty" placeholder="Party ka naam…" autocomplete="off"
               value="${selParty?esc(selParty.name):''}"></div></div>`:''}
          ${rep.needsItem?`<div style="min-width:230px"><label class="f">Item</label>
            <div class="cb"><input class="in" id="rItem" placeholder="Code ya naam…" autocomplete="off"
               value="${selItem?esc(selItem.app_code+' · '+selItem.name):''}"></div></div>`:''}
          ${dated?`<div><label class="f">From</label><input class="in" type="date" id="rF" value="${from}"></div>
          <div><label class="f">To</label><input class="in" type="date" id="rT" value="${to}"></div>`:''}
          <div style="align-self:flex-end"><button class="btn btn-p" id="rGo">Dekho</button></div>
        </div>
      </div></div>
      <div id="rOut"><div class="empty"><b>Load ho raha hai…</b></div></div>
    </div>`;
    $('#rBack').onclick=()=>{ tab=null; hub() };
    if($('#rParty')) combo($('#rParty'), partyRows(null), r=>{ selParty=r.p; $('#rParty').value=r.label; render() });
    if($('#rItem'))  combo($('#rItem'),  itemRows(),      r=>{ selItem=r.i;  $('#rItem').value=r.label;  render() });
    if($('#rGo')) $('#rGo').onclick=()=>{
      if($('#rF')){ from=$('#rF').value; to=$('#rT').value }
      render();
    };
    render();
  };

  const kpi=(list)=>`<div class="grid g${list.length>2?'3':'2'} mb">${list.map(k=>
    `<div class="kpi" style="--k:${k.c||'var(--blue)'}"><div class="lab">${k.l}</div>
     <div class="val">${k.v}</div></div>`).join('')}</div>`;

  const tableCard=(title,head,rows,csvName,csvRows,maxh)=>`
    <div class="card"><div class="card-h"><h3>${title}</h3><div class="sp"></div>
      <button class="btn btn-o btn-sm" id="rx">${ico(I.dl,13)} CSV</button></div>
      <div class="card-b tight"><div class="tscroll" style="max-height:${maxh||'56vh'}"><table class="t">
        <thead><tr>${head}</tr></thead>
        <tbody>${rows||`<tr><td colspan="9" class="c muted" style="padding:30px">Kuch nahi mila.</td></tr>`}</tbody>
      </table></div></div></div>`;

  async function vouchersIn(types){
    const {data,error}=await sb.from('vouchers').select('*').in('vtype',types)
      .gte('vdate',from).lte('vdate',to).order('vdate').order('id');
    if(error) throw error;
    return data||[];
  }
  async function linesFor(ids){
    let out=[];
    for(let i=0;i<ids.length;i+=200){
      const {data}=await sb.from('lines').select('*').in('voucher_id',ids.slice(i,i+200));
      out=out.concat(data||[]);
    }
    return out;
  }

  async function render(){
    const out=$('#rOut'); busy(true);
    try{

      /* ---------- PARTY STATEMENT ---------- */
      if(tab==='partystmt'){
        if(!selParty){ out.innerHTML='<div class="empty"><b>Upar se party chuno.</b></div>'; return }
        out.innerHTML=`<div class="empty"><b>${esc(selParty.name)} ka ledger khul raha hai…</b></div>`;
        ledger(selParty.party_id||selParty.id);
        return;
      }

      /* ---------- ALL TRANSACTIONS ---------- */
      if(tab==='alltxn'){
        const vs=await vouchersIn(['sale','purchase','receipt','payment','sale_return','purchase_return']);
        const sum=t2=>vs.filter(v=>v.vtype===t2).reduce((a,v)=>a+ +v.total,0);
        out.innerHTML=kpi([{l:'Entries',v:vs.length,c:'var(--gold)'},
                           {l:'Sale',v:money(sum('sale')),c:'var(--green)'},
                           {l:'Purchase',v:money(sum('purchase')),c:'var(--blue)'},
                           {l:'Paisa aaya − diya',v:money(sum('receipt')-sum('payment')),c:'var(--gold)'}])
          + tableCard('All transactions · '+dmy(from)+' → '+dmy(to),
            `<th>No.</th><th>Type</th><th class="hide-m">Date</th><th>Party</th><th class="r">Amount</th>`,
            vs.slice().reverse().map(v=>`<tr class="click" data-v="${v.id}">
              <td><b>${esc(v.vno)}</b></td>
              <td><span class="pill ${vpill(v.vtype)}">${vlab(v.vtype)}</span></td>
              <td class="small hide-m">${dmy(v.vdate)}</td>
              <td>${esc(v.party_name||'—')}</td>
              <td class="r tnum"><b>${money(v.total)}</b></td></tr>`).join(''));
        $('#rx').onclick=()=>exportCSV('all-transactions-'+from+'-'+to+'.csv',
          [['No','Type','Date','Party','Amount']].concat(
            vs.map(v=>[v.vno,vlab(v.vtype),v.vdate,v.party_name||'',n2(v.total)])));
        $$('#rOut tr[data-v]').forEach(tr=>tr.onclick=()=>viewVoucher(+tr.dataset.v));
        return;
      }

      /* ---------- PROFIT & LOSS ---------- */
      if(tab==='pl'){
        const vs=await vouchersIn(['sale','purchase','sale_return','purchase_return']);
        const sum=t2=>vs.filter(v=>v.vtype===t2).reduce((a,v)=>a+ +v.total,0);
        const {data:pl}=await sb.from('v_profit_line').select('amount,cost_amount')
          .gte('vdate',from).lte('vdate',to);
        const gs=(pl||[]).reduce((a,r)=>a+ +r.amount,0);
        const gc=(pl||[]).reduce((a,r)=>a+ +r.cost_amount,0);
        const sr=sum('sale_return'), gp=gs-gc-sr;
        const row=(l,v,b,c)=>`<div class="l${b?' big':''}"><span class="${b?'':'muted'}">${l}</span><b class="${c||''}">${v}</b></div>`;

                           {l:'Maal ka cost',v:money(gc),c:'var(--blue)'},
                           {l:'Gross profit',v:money(gp),c:gp>=0?'var(--gold)':'var(--red)'},
                           {l:'Margin',v:(gs?n2(gp/gs*100):0)+'%',c:'var(--gold)'}])
          + `<div class="card"><div class="card-h"><h3>Profit &amp; Loss · ${dmy(from)} → ${dmy(to)}</h3></div>
              <div class="card-b"><div class="tot">
                ${row('Sale',money(gs))}
                ${row('(−) Sale return',money(sr),false,'led-dr')}
                ${row('(−) Bike hue maal ka cost',money(gc),false,'led-dr')}
                ${row('Gross profit',money(gp),true,gp<0?'led-dr':'')}
                ${row('Margin %',(gs?n2(gp/gs*100):0)+'%')}
              </div>
              <div class="tot mt">
                ${row('Purchase (is duration me)',money(sum('purchase')))}
                ${row('Purchase return',money(sum('purchase_return')))}
              </div>
              <div class="note mt">Ye <b>gross profit</b> hai — maal ka cost nikaal ke. Transport, salary,
                rent jaise kharche ismein nahi hain, wo Vyapar me hi rahenge.</div>
              </div></div>`;
        return;
      }

      /* ---------- BILL-WISE PROFIT ---------- */
      if(tab==='billprofit'){
        const {data}=await sb.from('v_profit_line').select('voucher_id,vdate,party_name,amount,cost_amount')
          .gte('vdate',from).lte('vdate',to);
        const g={};
        (data||[]).forEach(r=>{
          const k=r.voucher_id;
          (g[k]=g[k]||{d:r.vdate,p:r.party_name,s:0,c:0}); g[k].s+= +r.amount; g[k].c+= +r.cost_amount });
        const vno={};
        const ids=Object.keys(g).map(Number);
        for(let i=0;i<ids.length;i+=200){
          const {data:vv}=await sb.from('vouchers').select('id,vno').in('id',ids.slice(i,i+200));
          (vv||[]).forEach(v=>vno[v.id]=v.vno);
        }
        const list=Object.entries(g).sort((a,b)=>(b[1].s-b[1].c)-(a[1].s-a[1].c));
        const ts=list.reduce((a,x)=>a+x[1].s,0), tc=list.reduce((a,x)=>a+x[1].c,0);
        out.innerHTML=kpi([{l:'Bills',v:list.length,c:'var(--gold)'},

             <th class="r hide-m">Cost</th><th class="r">Profit</th><th class="r hide-m">%</th>`,

              return `<tr class="click" data-v="${k}"><td><b>${esc(vno[k]||k)}</b></td>

        $('#rx').onclick=()=>exportCSV('bill-profit-'+from+'-'+to+'.csv',
          [['Bill','Date','Party','Sale','Cost','Profit']].concat(
            list.map(([k,v])=>[vno[k]||k,v.d,v.p||'',n2(v.s),n2(v.c),n2(v.s-v.c)])));
        $$('#rOut tr[data-v]').forEach(tr=>tr.onclick=()=>viewVoucher(+tr.dataset.v));
        return;
      }

      /* ---------- CASH FLOW ---------- */
      if(tab==='cashflow'){
        const vs=await vouchersIn(['receipt','payment']);
        const modes={};
        vs.forEach(v=>{ const m=(v.mode||'cash').toLowerCase();
          (modes[m]=modes[m]||{i:0,o:0});
          if(v.vtype==='receipt') modes[m].i+= +v.total; else modes[m].o+= +v.total });
        const inn=vs.filter(v=>v.vtype==='receipt').reduce((a,v)=>a+ +v.total,0);
        const outp=vs.filter(v=>v.vtype==='payment').reduce((a,v)=>a+ +v.total,0);
        out.innerHTML=kpi([{l:'Paisa aaya',v:money(inn),c:'var(--green)'},

                           {l:'Net',v:money(inn-outp),c:(inn-outp)>=0?'var(--gold)':'var(--red)'}])
          + `<div class="card mb"><div class="card-h"><h3>Mode ke hisaab se</h3></div>

             <thead><tr><th>Mode</th><th class="r">Aaya</th><th class="r">Diya</th><th class="r">Net</th></tr></thead>
             <tbody>${Object.entries(modes).sort((a,b)=>(b[1].i+b[1].o)-(a[1].i+a[1].o))
              .map(([m,v])=>`<tr><td><b>${esc(m.toUpperCase())}</b></td>

            rows.map(s=>[s.app_code,s.item_name,s.size,s.finish,n2(s.qty),n2(s.low_stock_level)])));
        return;
      }

      /* ---------- PAYMENT REGISTER ---------- */
      if(tab==='payreg'){
        const vs=await vouchersIn(['receipt','payment']);
        const inn=vs.filter(v=>v.vtype==='receipt').reduce((a,v)=>a+ +v.total,0);
        const outp=vs.filter(v=>v.vtype==='payment').reduce((a,v)=>a+ +v.total,0);
        out.innerHTML=kpi([{l:'Paisa aaya',v:money(inn),c:'var(--green)'},
                           {l:'Paisa diya',v:money(outp),c:'var(--red)'},
                           {l:'Net',v:money(inn-outp),c:'var(--gold)'}])
          + tableCard('Payment register · '+dmy(from)+' → '+dmy(to),
            `<th>No.</th><th class="hide-m">Date</th><th>Party</th><th class="hide-m">Mode</th><th class="r">Amount</th>`,
            vs.map(v=>`<tr class="click" data-v="${v.id}"><td><b>${esc(v.vno)}</b><br>
                <span class="pill ${vpill(v.vtype)}">${vlab(v.vtype)}</span></td>
              <td class="small hide-m">${dmy(v.vdate)}</td><td>${esc(v.party_name||'—')}</td>
              <td class="small hide-m">${esc((v.mode||'—').toUpperCase())}</td>
              <td class="r tnum"><b>${money(v.total)}</b></td></tr>`).join(''));
        $('#rx').onclick=()=>exportCSV('payments-'+from+'-'+to+'.csv',
          [['No','Type','Date','Party','Mode','Amount']].concat(
            vs.map(v=>[v.vno,vlab(v.vtype),v.vdate,v.party_name||'',v.mode||'',n2(v.total)])));
        $$('#rOut tr[data-v]').forEach(tr=>tr.onclick=()=>viewVoucher(+tr.dataset.v));
        return;
      }

      /* ---------- DAY BOOK ---------- */
      if(tab==='daybook'){
        const vs=await vouchersIn(['sale','purchase','receipt','payment','sale_return','purchase_return']);
        const g={};
        vs.forEach(v=>(g[v.vdate]=g[v.vdate]||[]).push(v));
        const days=Object.keys(g).sort().reverse();
        const sum=t2=>vs.filter(v=>v.vtype===t2).reduce((a,v)=>a+ +v.total,0);
        out.innerHTML=kpi([{l:'Sale',v:money(sum('sale')),c:'var(--green)'},
                           {l:'Purchase',v:money(sum('purchase')),c:'var(--blue)'},
                           {l:'Aaya',v:money(sum('receipt')),c:'var(--gold)'},
                           {l:'Diya',v:money(sum('payment')),c:'var(--red)'}])
          + days.map(dd=>{
              const list=g[dd];
              return `<div class="card mb"><div class="card-h"><h3>${dmy(dd)}</h3><div class="sp"></div>
                <span class="small muted">${list.length} entries</span></div>
                <div class="card-b tight"><table class="t">
                <tbody>${list.map(v=>`<tr class="click" data-v="${v.id}">
                  <td><b>${esc(v.vno)}</b> <span class="pill ${vpill(v.vtype)}">${vlab(v.vtype)}</span></td>
                  <td>${esc(v.party_name||'—')}</td>
                  <td class="r tnum"><b>${money(v.total)}</b></td></tr>`).join('')}</tbody>
                </table></div></div>`;
            }).join('') || `<div class="empty"><b>Is range me koi entry nahi.</b></div>`;
        $$('#rOut tr[data-v]').forEach(tr=>tr.onclick=()=>viewVoucher(+tr.dataset.v));
        return;
      }

      /* ---------- PROFIT ---------- */
      if(tab==='profit'){
        const {data}=await sb.from('v_profit_line').select('*')
          .gte('vdate',from).lte('vdate',to);
        const rows=data||[];
        const sale=rows.reduce((a,r)=>a+ +r.amount,0);
        const cost=rows.reduce((a,r)=>a+ +r.cost_amount,0);
        const prof=sale-cost;
        const pct=sale?(prof/sale*100):0;
        const agg={};
        rows.forEach(r=>{ const k=r.app_code||r.label||'—';
          (agg[k]=agg[k]||{n:r.item_name||'',q:0,s:0,c:0});
          agg[k].q+= +r.qty; agg[k].s+= +r.amount; agg[k].c+= +r.cost_amount });
        const list=Object.entries(agg).sort((a,b)=>(b[1].s-b[1].c)-(a[1].s-a[1].c));
        const noCost=rows.filter(r=>+r.cost_rate<=0).length;
        out.innerHTML=kpi([{l:'Sale',v:money(sale),c:'var(--green)'},
                           {l:'Cost',v:money(cost),c:'var(--blue)'},
                           {l:'Profit',v:money(prof),c:prof>=0?'var(--gold)':'var(--red)'},
                           {l:'Margin',v:n2(pct)+'%',c:'var(--gold)'}])
          + (noCost?`<div class="note note-w mb">${noCost} line ka purchase rate 0 tha, unka profit poora sale dikh raha hai.
              Items → Rate badlo me purchase rate bhar do, aage ki entries sahi aayengi.</div>`:'')
          + tableCard('Item-wise profit · '+dmy(from)+' → '+dmy(to),
            `<th>Item</th><th class="r">Qty</th><th class="r">Sale</th>
             <th class="r hide-m">Cost</th><th class="r">Profit</th><th class="r hide-m">%</th>`,
            list.map(([k,v])=>{ const p=v.s-v.c;
              return `<tr><td><b>${esc(k)}</b><br><span class="muted small">${esc(v.n)}</span></td>
                <td class="r tnum">${qty(v.q)}</td><td class="r tnum">${money(v.s)}</td>
                <td class="r tnum hide-m">${money(v.c)}</td>
                <td class="r tnum"><b class="${p<0?'led-dr':''}">${money(p)}</b></td>
                <td class="r tnum hide-m">${v.s?n2(p/v.s*100):0}%</td></tr>`}).join(''));
        $('#rx').onclick=()=>exportCSV('profit-'+from+'-'+to+'.csv',
          [['Code','Item','Qty','Sale','Cost','Profit']].concat(
            list.map(([k,v])=>[k,v.n,n2(v.q),n2(v.s),n2(v.c),n2(v.s-v.c)])));
        return;
      }

      /* ---------- STOCK MOVEMENT ---------- */
      if(tab==='movement'){
        const vs=await vouchersIn(['sale','purchase','sale_return','purchase_return']);
        const byId={}; vs.forEach(v=>byId[v.id]=v);
        const ls=await linesFor(vs.map(v=>v.id));
        const agg={};
        ls.forEach(l=>{
          const v=byId[l.voucher_id]; if(!v) return;
          const vr=S.varById[l.variant_id]; const it=vr?S.itemById[vr.item_id]:null;
          const k=it?it.app_code:(l.label||'—');
          const a=(agg[k]=agg[k]||{n:it?it.name:'',in:0,out:0});
          if(v.vtype==='purchase'||v.vtype==='sale_return') a.in+= +l.qty;
          else a.out+= +l.qty;
        });
        const closeBy={};
        S.stock.forEach(s=>closeBy[s.app_code]=(closeBy[s.app_code]||0)+ +s.qty);
        const list=Object.entries(agg).sort((a,b)=>b[1].out-a[1].out);
        out.innerHTML=kpi([{l:'Andar aaya',v:qty(list.reduce((a,x)=>a+x[1].in,0)),c:'var(--blue)'},
                           {l:'Bahar gaya',v:qty(list.reduce((a,x)=>a+x[1].out,0)),c:'var(--green)'}])
          + tableCard('Stock movement · '+dmy(from)+' → '+dmy(to),
            `<th>Item</th><th class="r">Aaya</th><th class="r">Gaya</th><th class="r">Abhi stock</th>`,
            list.map(([k,v])=>`<tr><td><b>${esc(k)}</b><br><span class="muted small">${esc(v.n)}</span></td>
              <td class="r tnum">${qty(v.in)}</td><td class="r tnum">${qty(v.out)}</td>
              <td class="r tnum"><b>${qty(closeBy[k]||0)}</b></td></tr>`).join(''));
        $('#rx').onclick=()=>exportCSV('stock-movement-'+from+'-'+to+'.csv',
          [['Code','Item','In','Out','Closing']].concat(
            list.map(([k,v])=>[k,v.n,n2(v.in),n2(v.out),n2(closeBy[k]||0)])));
        return;
      }

      /* ---------- BUSINESS SUMMARY ---------- */
      if(tab==='summary'){
        const vs=await vouchersIn(['sale','purchase','receipt','payment','sale_return','purchase_return']);
        const sum=t2=>vs.filter(v=>v.vtype===t2).reduce((a,v)=>a+ +v.total,0);
        const cnt=t2=>vs.filter(v=>v.vtype===t2).length;
        const {data:pl}=await sb.from('v_profit_line').select('amount,cost_amount')
          .gte('vdate',from).lte('vdate',to);
        const gs=(pl||[]).reduce((a,r)=>a+ +r.amount,0);
        const gc=(pl||[]).reduce((a,r)=>a+ +r.cost_amount,0);
        const {data:ob}=await sb.from('v_bill_outstanding').select('vtype,due');
        const recv=(ob||[]).filter(b=>b.vtype==='sale').reduce((a,b)=>a+ +b.due,0);
        const payb=(ob||[]).filter(b=>b.vtype==='purchase').reduce((a,b)=>a+ +b.due,0);
        const stkC=S.stock.reduce((a,s)=>a+Math.max(0,+s.qty)*(+(S.varById[s.variant_id]||{}).purchase_rate||0),0);
        const row=(l,v,c)=>`<div class="l"><span class="muted">${l}</span><b class="${c||''}">${v}</b></div>`;
        out.innerHTML=`
          <div class="grid g2 mb">
            <div class="card"><div class="card-h"><h3>Is duration me</h3></div><div class="card-b">
              <div class="tot">
                ${row('Sale ('+cnt('sale')+' bill)',money(sum('sale')))}
                ${row('Sale return',money(sum('sale_return')),'led-dr')}
                ${row('Purchase ('+cnt('purchase')+')',money(sum('purchase')))}
                ${row('Purchase return',money(sum('purchase_return')))}
                ${row('Paisa aaya',money(sum('receipt')))}
                ${row('Paisa diya',money(sum('payment')))}
              </div></div></div>
            <div class="card"><div class="card-h"><h3>Profit</h3></div><div class="card-b">
              <div class="tot">
                ${row('Sale value',money(gs))}
                ${row('Maal ka cost',money(gc))}
                ${row('Gross profit',money(gs-gc),(gs-gc)<0?'led-dr':'')}
                ${row('Margin',(gs?n2((gs-gc)/gs*100):0)+'%')}
              </div></div></div>
          </div>
          <div class="grid g3">
            <div class="kpi" style="--k:var(--red)"><div class="lab">Lena baaki (bills)</div><div class="val">${money(recv)}</div></div>
            <div class="kpi" style="--k:var(--amber)"><div class="lab">Dena baaki (bills)</div><div class="val">${money(payb)}</div></div>
            <div class="kpi" style="--k:var(--blue)"><div class="lab">Stock ka cost value</div><div class="val">${money(stkC)}</div></div>
          </div>`;
        return;
      }

      /* ---------- PARTY-WISE SALE ---------- */
      if(tab==='partysale'){
        const vs=await vouchersIn(['sale']);
        const agg={};
        vs.forEach(v=>{ const k=v.party_name||'—';
          (agg[k]=agg[k]||{n:0,a:0}); agg[k].n++; agg[k].a+= +v.total });
        const list=Object.entries(agg).sort((a,b)=>b[1].a-a[1].a);
        const tot=list.reduce((a,x)=>a+x[1].a,0);
        out.innerHTML=kpi([{l:'Sale total',v:money(tot),c:'var(--green)'},
                           {l:'Kitni party',v:list.length,c:'var(--blue)'},
                           {l:'Bills',v:vs.length,c:'var(--gold)'}])
          + tableCard('Party-wise sale · '+dmy(from)+' → '+dmy(to),
            `<th>Party</th><th class="r">Bills</th><th class="r">Amount</th><th class="r hide-m">Share</th>`,
            list.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="r tnum">${v.n}</td>
              <td class="r tnum"><b>${money(v.a)}</b></td>
              <td class="r tnum hide-m">${tot?n2(v.a/tot*100):0}%</td></tr>`).join(''));
        $('#rx').onclick=()=>exportCSV('party-wise-sale-'+from+'-'+to+'.csv',
          [['Party','Bills','Amount']].concat(list.map(([k,v])=>[k,v.n,n2(v.a)])));
        return;
      }

      /* ---------- ITEM-WISE SALE / PURCHASE ---------- */
      if(tab==='itemsale'||tab==='itembuy'){
        const isS = tab==='itemsale';
        const vs=await vouchersIn(isS?['sale']:['purchase']);
        const ls=await linesFor(vs.map(v=>v.id));
        const tot=vs.reduce((a,v)=>a+ +v.total,0);
        const agg={};
        ls.forEach(l=>{ const k=l.label||'—';
          (agg[k]=agg[k]||{q:0,a:0}); agg[k].q+= +l.qty; agg[k].a+= +l.amount });
        const list=Object.entries(agg).sort((a,b)=>b[1].a-a[1].a);
        out.innerHTML=kpi([{l:(isS?'Sale':'Purchase')+' total',v:money(tot),c:isS?'var(--green)':'var(--blue)'},
                           {l:'Bills',v:vs.length},
                           {l:'Alag item',v:list.length,c:'var(--gold)'}])
          + tableCard((isS?'Item-wise sale · ':'Item-wise purchase · ')+dmy(from)+' → '+dmy(to),
            `<th>Item</th><th class="r">Qty</th><th class="r">Amount</th>`,
            list.map(([k,v])=>`<tr><td class="small">${esc(k)}</td>
              <td class="r tnum">${qty(v.q)}</td><td class="r tnum"><b>${money(v.a)}</b></td></tr>`).join(''));
        $('#rx').onclick=()=>exportCSV(tab+'-'+from+'-'+to+'.csv',
          [['Item','Qty','Amount']].concat(list.map(([k,v])=>[k,n2(v.q),n2(v.a)])));
        return;
      }

      /* ---------- REGISTERS: sale / purchase / returns ---------- */
      const vts = tab==='purchase'?['purchase']
                : tab==='ret'?['sale_return','purchase_return']
                : ['sale'];
      const vs=await vouchersIn(vts);
      const tot=vs.reduce((a,v)=>a+ +v.total,0);
      const regName = tab==='ret'?'Returns' : tab==='purchase'?'Purchase':'Sale';
      out.innerHTML=kpi([
          {l:regName+' total',v:money(tot),c:tab==='sale'?'var(--green)':tab==='ret'?'var(--red)':'var(--blue)'},
          {l:'Entries',v:vs.length},
          {l:'Average',v:money(vs.length?tot/vs.length:0),c:'var(--gold)'}])
        + tableCard(regName+' register · '+dmy(from)+' → '+dmy(to),
          `<th>No.</th><th>Date</th><th>Party</th><th class="r">Amount</th>`,
          vs.map(v=>`<tr class="click" data-v="${v.id}">
            <td><b>${esc(v.vno)}</b>${tab==='ret'?`<br><span class="pill ${vpill(v.vtype)}">${vlab(v.vtype)}</span>`:''}</td>
            <td class="small">${dmy(v.vdate)}</td>
            <td>${esc(v.party_name||'—')}</td><td class="r tnum"><b>${money(v.total)}</b></td></tr>`).join(''));
      $('#rx').onclick=()=>exportCSV(tab+'-register-'+from+'-'+to+'.csv',
        [['No','Type','Date','Party','Amount']].concat(
          vs.map(v=>[v.vno,vlab(v.vtype),v.vdate,v.party_name||'',n2(v.total)])));
      $$('#rOut tr[data-v]').forEach(tr=>tr.onclick=()=>viewVoucher(+tr.dataset.v));

    }catch(e){ out.innerHTML=`<div class="empty"><b>Load nahi hua</b><div class="small">${esc(e.message||e)}</div></div>` }
    finally{ busy(false) }
  }
  draw();
};

        <p class="small muted" style="margin-top:0">Naya staff login Supabase dashboard se banta hai —
          Authentication → Users → Add user. Har aadmi ka apna email-password rakho.</p>
        <div class="small muted">Abhi logged in: <b>${esc((S.user&&S.user.email)||'—')}</b></div>
      </div>
    </div>
  </div>`;

  const imp=$('#imp'); if(imp) imp.onclick=runImport;
    if($('#stTpl')) $('#stTpl').onclick=()=>exportCSV('aadhaya-stock-template.csv',
      [['code','size','finish','qty','purchase_rate']].concat(
        S.variants.map(v=>{ const it=S.itemById[v.item_id]||{};
          return [it.app_code||'', v.size, v.finish, '', n2(v.purchase_rate||0)] })));

    const readStock=()=>{
      const rows=parseCSV($('#stT').value.trim());
      if(rows.length<2) return null;
      const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
      const ix=k=>head.indexOf(k);
      const iC=ix('code'), iS=ix('size'), iF=ix('finish'), iQ=ix('qty'), iR=ix('purchase_rate');
      if(iC<0||iQ<0) return {err:'CSV me "code" aur "qty" column zaroori hai'};
      const nrm=x=>String(x==null?'':x).trim().toLowerCase().replace(/[^a-z0-9]/g,'');
      const vkey={};
      S.variants.forEach(v=>{ const it=S.itemById[v.item_id]; if(!it) return;
        vkey[it.app_code.toUpperCase()+'|'+nrm(v.size)+'|'+nrm(v.finish)]=v });
      const hit=[], miss=[];
      for(let r=1;r<rows.length;r++){
        const c=rows[r];
        const code=(c[iC]||'').trim().toUpperCase(); if(!code) continue;
        const qt=String(c[iQ]==null?'':c[iQ]).trim(); if(qt==='') continue;
        const q=+qt.replace(/[^\d.-]/g,''); if(isNaN(q)) continue;
        const k=code+'|'+nrm(iS>=0?c[iS]:'-')+'|'+nrm(iF>=0?c[iF]:'-');
        const v=vkey[k];
        if(!v){ miss.push(code+' '+(iS>=0?c[iS]:'')+' '+(iF>=0?c[iF]:'')); continue }
        const pr = iR>=0 ? +String(c[iR]||'').replace(/[^\d.-]/g,'') : NaN;
        hit.push({v, q, pr:isNaN(pr)?null:pr});
      }
      return {hit, miss};
    };
    const sprev=()=>{
      const el=$('#stPrev'); if(!el) return;
      const r=readStock();
      if(!r){ el.textContent=''; return }
      if(r.err){ el.innerHTML='<b class="led-dr">'+esc(r.err)+'</b>'; return }
      const ch=r.hit.filter(x=>n2(stockOf(x.v.id))!==n2(x.q)).length;
      el.innerHTML=`<b>${r.hit.length}</b> variant mile · <b class="led-cr">${ch} ka stock badlega</b>`
        + (r.miss.length?` · <b class="led-dr">${r.miss.length} match nahi hue</b>
           <span class="muted">(${esc(r.miss.slice(0,3).join(' | '))}${r.miss.length>3?' …':''})</span>`:'');
    };
    if($('#stT')) $('#stT').oninput=sprev;
    if($('#stF')) $('#stF').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onload=()=>{ $('#stT').value=String(fr.result||'').replace(/^\ufeff/,''); sprev() };
      fr.readAsText(f);
    };
    if($('#stGo')) $('#stGo').onclick=async()=>{
      const r=readStock();
      if(!r){ toast('Pehle CSV daalo','err'); return }
      if(r.err){ toast(r.err,'err'); return }
      const adj=[];
      r.hit.forEach(x=>{ const d=n2(x.q-stockOf(x.v.id));
        if(d) adj.push({variant_id:x.v.id, qty:d, reason:'CSV se stock bhara'}) });
      const rates=r.hit.filter(x=>x.pr!=null && n2(x.pr)!==n2(x.v.purchase_rate));
      if(!adj.length && !rates.length){ toast('Kuch change nahi','err'); return }
      const ok=await confirmBox('Stock bharein?',
        `<div class="small"><b>${adj.length}</b> variant ka stock set hoga${rates.length?`, <b>${rates.length}</b> ka purchase rate bhi`:''}.</div>
         ${r.miss.length?`<p class="small muted mt-s"><b class="led-dr">${r.miss.length} line</b> ka code/size/finish match nahi hua — wo chhod di jayengi.</p>`:''}`,
        'Haan, bhar do');
      if(!ok) return;
      busy(true);
      try{
        if(adj.length) await insBatch('adjustments',adj,300);
        for(const x of rates){ await upd('variants',x.v.id,{purchase_rate:x.pr}); x.v.purchase_rate=x.pr }
        await refreshStock(); paintNav();
        toast(adj.length+' variant ka stock bhar gaya','ok');
        SCREEN.setup();
      }catch(e){ toast('Nahi hua: '+(e.message||e),'err') }
      finally{ busy(false) }
    };

    const readParty=()=>{
      const rows=parseCSV($('#pcsvT').value.trim());
      if(rows.length<2) return null;
      const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
      const ix=k=>head.indexOf(k);
      const iN=ix('name');
      if(iN<0) return {err:'CSV me "name" column zaroori hai'};
      const iP=ix('phone'), iC=ix('city'), iA=ix('address'), iK=ix('kind'),
            iB=ix('opening_balance'), iT=ix('opening_type'), iCd=ix('code');
      const num=v=>+String(v==null?'':v).replace(/[^\d.-]/g,'')||0;
      const out=[];
      for(let r=1;r<rows.length;r++){
        const c=rows[r]; const nm=(c[iN]||'').trim(); if(!nm) continue;
        let kind=(iK>=0?(c[iK]||'').trim().toLowerCase():'customer');
        if(!['customer','supplier','both'].includes(kind)) kind='customer';
        let ot=(iT>=0?(c[iT]||'').trim().toLowerCase():'dr');
        if(ot!=='cr') ot='dr';
        out.push({name:nm, phone:iP>=0?(c[iP]||'').trim()||null:null,
          city:iC>=0?(c[iC]||'').trim()||null:null,
          address:iA>=0?(c[iA]||'').trim()||null:null,
          code:iCd>=0?(c[iCd]||'').trim()||null:null,
          kind, opening_balance:iB>=0?num(c[iB]):0, opening_type:ot});
      }
      return {rows:out};
    };
    const pprev=()=>{
      const el=$('#pcsvPrev'); if(!el) return;
      const r=readParty();
      if(!r){ el.textContent=''; return }
      if(r.err){ el.innerHTML='<b class="led-dr">'+esc(r.err)+'</b>'; return }
      const have=new Set(S.parties.map(x=>x.name.trim().toLowerCase()));
      const nw=r.rows.filter(x=>!have.has(x.name.toLowerCase())).length;
      const bal=r.rows.reduce((a,x)=>a+x.opening_balance,0);
      el.innerHTML=`<b>${r.rows.length}</b> party (<b class="led-cr">${nw} nayi</b>,
        ${r.rows.length-nw} pehle se) · opening total <b>${money(bal)}</b>`;
    };
    if($('#pcsvT')) $('#pcsvT').oninput=pprev;
    if($('#pcsvF')) $('#pcsvF').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onload=()=>{ $('#pcsvT').value=String(fr.result||'').replace(/^\ufeff/,''); pprev() };
      fr.readAsText(f);
    };
    if($('#pcsvSample')) $('#pcsvSample').onclick=()=>exportCSV('aadhaya-party-sample.csv',[
      ['name','phone','city','address','kind','opening_balance','opening_type'],
      ['Shree Traders','9876543210','Rajkot','Main Road','customer',5000,'dr'],
      ['Metal Supply Co','9812345678','Jamnagar','','supplier',2000,'cr']]);
    if($('#pcsvGo')) $('#pcsvGo').onclick=async()=>{
      const r=readParty();
      if(!r){ toast('Pehle CSV daalo','err'); return }
      if(r.err){ toast(r.err,'err'); return }
      const have=new Set(S.parties.map(x=>x.name.trim().toLowerCase()));
      const mk=r.rows.filter(x=>!have.has(x.name.toLowerCase()));
      if(!mk.length){ toast('Saari party pehle se hain','err'); return }
      const ok=await confirmBox('Party import karein?',
        `<div class="small"><b>${mk.length}</b> nayi party banegi.
          ${r.rows.length-mk.length} pehle se hain, unhe chhod diya jayega.</div>
         <p class="small muted mt-s">Opening balance bhi saath me aa jayega.</p>`,'Haan, import karo');
      if(!ok) return;
      busy(true);
      try{
        await insBatch('parties', mk.map(x=>({name:x.name,phone:x.phone,city:x.city,
          address:x.address,code:x.code,kind:x.kind,
          opening_balance:x.opening_balance,opening_type:x.opening_type})), 200);
        await refreshParties();
        toast(mk.length+' party import ho gayi','ok');
        SCREEN.setup();
      }catch(e){ toast('Import nahi hua: '+(e.message||e),'err') }
      finally{ busy(false) }
    };

    const parseCSV=(txt)=>{
      const rows=[]; let row=[], cell='', q=false;
      for(let i=0;i<txt.length;i++){
        const ch=txt[i];
        if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch }
        else if(ch==='"') q=true;
        else if(ch===','){ row.push(cell); cell='' }
        else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell='' }
        else if(ch!=='\r') cell+=ch;
      }
      if(cell!==''||row.length){ row.push(cell); rows.push(row) }
      return rows.filter(r=>r.some(c=>String(c).trim()!==''));
    };
    const readCSV=()=>{
      const rows=parseCSV($('#csvT').value.trim());
      if(rows.length<2) return null;
      const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
      const ix=k=>head.indexOf(k);
      const iC=ix('code'), iN=ix('name');
      if(iC<0||iN<0) return {err:'CSV me "code" aur "name" column zaroori hai'};
      const iCat=ix('category'), iS=ix('size'), iF=ix('finish'),
            iSR=ix('sale_rate'), iPR=ix('purchase_rate'), iQ=ix('opening_qty');
      const out=[];
      for(let r=1;r<rows.length;r++){
        const c=rows[r];
        const code=(c[iC]||'').trim().toUpperCase();
        const nm=(c[iN]||'').trim();
        if(!code||!nm) continue;
        out.push({ code, name:nm,
          category:iCat>=0?(c[iCat]||'').trim():'',
          size:(iS>=0?(c[iS]||'').trim():'')||'-',
          finish:(iF>=0?(c[iF]||'').trim():'')||'-',
          sale_rate:iSR>=0?(+String(c[iSR]||'').replace(/[^\d.-]/g,'')||0):0,
          purchase_rate:iPR>=0?(+String(c[iPR]||'').replace(/[^\d.-]/g,'')||0):0,
          opening_qty:iQ>=0?(+String(c[iQ]||'').replace(/[^\d.-]/g,'')||0):0 });
      }
      return {rows:out};
    };
    const prev=()=>{
      const el=$('#csvPrev'); const r=readCSV();
      if(!r){ el.textContent=''; return }
      if(r.err){ el.innerHTML='<b class="led-dr">'+esc(r.err)+'</b>'; return }
      const codes=[...new Set(r.rows.map(x=>x.code))];
      const have=new Set(S.items.map(i=>i.app_code.toUpperCase()));
      const nw=codes.filter(c=>!have.has(c)).length;
      el.innerHTML=`<b>${r.rows.length}</b> line · <b>${codes.length}</b> code
        (<b class="led-cr">${nw} naya item</b>, ${codes.length-nw} pehle se hai)`;
    };
    $('#csvT').oninput=prev;
    $('#csvF').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onload=()=>{ $('#csvT').value=String(fr.result||'').replace(/^\ufeff/,''); prev() };
      fr.readAsText(f);
    };
    $('#csvSample').onclick=()=>exportCSV('aadhaya-item-sample.csv',[
      ['code','name','category','size','finish','sale_rate','purchase_rate','opening_qty'],
      ['AH-XX-001','Heavy Sofa Leg','Sofa Legs','4"','SS',145,110,0],
      ['AH-XX-001','Heavy Sofa Leg','Sofa Legs','6"','SS',165,125,0],
      ['AH-XX-002','Mortise Lock Body','Locks','-','-',420,330,0]]);

    $('#csvGo').onclick=async()=>{
      const r=readCSV();
      if(!r){ toast('Pehle CSV daalo','err'); return }
      if(r.err){ toast(r.err,'err'); return }
      if(!r.rows.length){ toast('Ek bhi sahi line nahi mili','err'); return }
      const codes=[...new Set(r.rows.map(x=>x.code))];
      const have=new Set(S.items.map(i=>i.app_code.toUpperCase()));
      const nw=codes.filter(c=>!have.has(c)).length;
      const ok=await confirmBox('Import karein?',
        `<div class="small"><b>${r.rows.length}</b> line · <b>${nw}</b> naya item banega ·
         baaki ${codes.length-nw} code me naye size/finish judenge.</div>
         <p class="small muted mt-s">Naye item <b>order app pe nahi dikhenge</b> — dikhana ho to Items me jaake switch ON karna.</p>`,
        'Haan, import karo');
      if(!ok) return;
      busy(true);
      try{
        const byCode={}; S.items.forEach(i=>byCode[i.app_code.toUpperCase()]=i);
        const mk=codes.filter(c=>!byCode[c]).map(c=>{
          const f=r.rows.find(x=>x.code===c);
          return {app_code:c, name:f.name, category:f.category||null, unit:'PCS', show_in_app:false};
        });
        if(mk.length){
          const made=await insBatch('items',mk,200);
          (made||[]).forEach(i=>byCode[i.app_code.toUpperCase()]=i);
        }
        const fresh=await all('items','*');
        S.items=fresh; fresh.forEach(i=>byCode[i.app_code.toUpperCase()]=i);
        const vAll=await all('variants','*');
        const seen=new Set(vAll.map(v=>v.item_id+'||'+v.size+'||'+v.finish));
        const nv=[];
        r.rows.forEach(x=>{
          const it=byCode[x.code]; if(!it) return;
          const k=it.id+'||'+x.size+'||'+x.finish; if(seen.has(k)) return;
          seen.add(k);
          nv.push({item_id:it.id,size:x.size,finish:x.finish,sale_rate:x.sale_rate,
                   purchase_rate:x.purchase_rate,opening_qty:x.opening_qty});
        });
        if(nv.length) await insBatch('variants',nv,300);
        S.variants=await all('variants','*');
        buildIx(); await refreshStock();
        toast(mk.length+' item, '+nv.length+' variant import ho gaye','ok');
        SCREEN.setup();
      }catch(e){ toast('Import nahi hua: '+(e.message||e),'err') }
      finally{ busy(false) }
    };

  $('#bkParty').onclick=()=>exportCSV('parties-'+today()+'.csv',
    [['Name','Kind','Phone','City','Balance']].concat(S.parties.map(p=>[p.name,p.kind,p.phone||'',p.city||'',n2(p.balance)])));
  $('#bkItem').onclick=()=>exportCSV('items-'+today()+'.csv',
    [['Code','Name','Category','Size','Finish','SaleRate','PurchaseRate','ShowInApp']].concat(
      S.variants.map(v=>{const i=S.itemById[v.item_id]||{};
        return [i.app_code||'',i.name||'',i.category||'',v.size,v.finish,n2(v.sale_rate),n2(v.purchase_rate),i.show_in_app?'yes':'no']})));
  $('#bkStock').onclick=()=>exportCSV('stock-'+today()+'.csv',
    [['Code','Item','Size','Finish','Qty']].concat(S.stock.map(s=>[s.app_code,s.item_name,s.size,s.finish,n2(s.qty)])));
  $('#bkVou').onclick=async()=>{
    busy(true);
    try{
      const vs=await all('vouchers','*',q=>q.order('id'));
      exportCSV('entries-'+today()+'.csv',
        [['Type','No','Date','Party','Total','Mode','Note']].concat(
          vs.map(v=>[v.vtype,v.vno,v.vdate,v.party_name||'',n2(v.total),v.mode||'',v.notes||''])));
    }catch(e){ toast('Export nahi hua','err') } finally{ busy(false) }
  };
};

async function runImport(){
  const ok=await confirmBox('Catalogue import',
    `<p class="small">Order app ke products items table me add honge. Jo code pehle se hai woh chhod diya jayega —
     kuch double nahi hoga.</p><p class="small muted">Thoda time lagega, page band mat karna.</p>`,'Haan, import karo');
  if(!ok) return;
  const box=$('#impBox');
  box.innerHTML=`<div class="small" id="ip">Shuru kar rahe hain…</div>`;
  const say=t=>{ const e=$('#ip'); if(e) e.textContent=t };
  busy(true);
  try{
    const have=new Set(S.items.map(i=>i.app_code.toUpperCase()));
    const todo=CATALOGUE.filter(c=>!have.has(c.c.toUpperCase()));
    if(!todo.length){ toast('Sab pehle se hai','ok'); SCREEN.setup(); return }

    say('Items bana rahe hain…');
    const made=await insBatch('items', todo.map((c,ix)=>({
      app_code:c.c, name:c.n, category:c.g, unit:'PCS', show_in_app:true, sort_order:ix
    })), 200, (d,t)=>say(`Items: ${d} / ${t}`));

    const byCode={}; made.forEach(m=>byCode[m.app_code.toUpperCase()]=m.id);
    const vrows=[];
    todo.forEach(c=>{
      const iid=byCode[c.c.toUpperCase()]; if(!iid) return;
      let k=0;
      c.s.forEach(sz=>c.f.forEach(fi=>{
        vrows.push({item_id:iid,size:sz,finish:fi,sale_rate:c.r[k]||0,
          purchase_rate:0,opening_qty:0,low_stock_level:10});
        k++;
      }));
    });
    say(`Variants bana rahe hain… (${vrows.length})`);
    await insBatch('variants', vrows, 400, (d,t)=>say(`Variants: ${Math.min(d,t)} / ${t}`));

    say('Refresh…');
    await reloadItems();
    toast(`${made.length} products aur ${vrows.length} variants import ho gaye`,'ok');
    SCREEN.setup();
  }catch(e){
    toast('Import ruk gaya: '+(e.message||e),'err');
    const b=$('#impBox'); if(b) b.innerHTML=`<div class="small led-dr">${esc(e.message||e)}</div>
      <button class="btn btn-o btn-blk mt-s" onclick="SCREEN.setup()">Dobara dekho</button>`;
  }finally{ busy(false) }
}

/* ================= AUTH / BOOT ================= */
async function boot(){
  if(!window.supabase){ lgErr('Internet slow lag raha hai — page refresh karo.'); return }
  sb = window.supabase.createClient(CFG.url, CFG.key);
  const {data}=await sb.auth.getSession();
  if(data && data.session){ await enter(data.session.user) }
  else { $('#login').style.display='flex' }
}
function lgErr(m){ $('#lgErr').textContent=m||'' }

async function enter(user){
  S.user=user;
  const nm=(user.email||'user').split('@')[0];
  $('#uname').textContent=nm;
  $('#uav').textContent=nm.slice(0,1).toUpperCase();
  $('#tdate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('#login').style.display='none';
  $('#app').classList.add('on');
  try{ await loadAll() }
  catch(e){ toast('Data load nahi hua: '+(e.message||e),'err') }
  paintNav(); go('home');
}

$('#lgBtn').onclick=doLogin;
$('#lgPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin() });
$('#lgEmail').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lgPass').focus() });

async function doLogin(){
  const email=$('#lgEmail').value.trim(), pass=$('#lgPass').value;
  if(!email||!pass){ lgErr('Email aur password dono daalo'); return }
  if(!sb){ lgErr('Connection nahi bana — page refresh karo'); return }
  const b=$('#lgBtn'); b.disabled=true; b.textContent='Ruko…'; lgErr('');
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      lgErr(/invalid/i.test(error.message)?'Email ya password galat hai.':error.message);
      return;
    }
    await enter(data.user);
  }catch(e){ lgErr('Login nahi hua: '+(e.message||e)) }
  finally{ b.disabled=false; b.textContent='Log in' }
}

$('#logout').onclick=async()=>{
  const ok=await confirmBox('Log out','<p class="small">Log out kar dein?</p>','Haan');
  if(!ok) return;
  await sb.auth.signOut(); location.reload();
};

boot();
